name: Showcase Render

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe to render (tuistory-launch, browser-loop, showcase-compose, qa-report)'
        required: true
        default: 'showcase-compose'
        type: choice
        options:
          - tuistory-launch
          - browser-loop
          - showcase-compose
          - qa-report
      capture_path:
        description: 'Optional capture run path to bind as clip source'
        required: false
        default: ''
      output_path:
        description: 'Output path for the rendered video'
        required: false
        default: 'artifacts/showcases/showcase.mp4'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && (cd remotion && npm install)

      - name: Ensure output directory exists
        run: mkdir -p artifacts/showcases

      - name: Render showcase
        env:
          RECIPE: ${{ github.event.inputs.recipe }}
          CAPTURE_PATH: ${{ github.event.inputs.capture_path }}
          OUTPUT_PATH: ${{ github.event.inputs.output_path }}
        run: |
          npx tsx remotion/scripts/render-showcase.ts \
            "$RECIPE" \
            "$CAPTURE_PATH" \
            "$OUTPUT_PATH"

      - name: Upload showcase artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-${{ github.event.inputs.recipe }}-${{ github.run_number }}
          path: ${{ github.event.inputs.output_path }}
          if-no-files-found: warn
