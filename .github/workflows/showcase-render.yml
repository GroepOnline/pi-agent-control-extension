name: Showcase Render

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: 'Recipe to render (tuistory-launch, browser-loop, showcase-compose, qa-report)'
        required: true
        default: 'showcase-compose'
        type: choice
        options:
          - tuistory-launch
          - browser-loop
          - showcase-compose
          - qa-report
      capture_path:
        description: 'Optional capture run path to bind as clip source'
        required: false
        default: ''
      output_path:
        description: 'Output path for the rendered video'
        required: false
        default: 'artifacts/showcases/showcase.mp4'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && (cd remotion && npm install)

      - name: Ensure output directory exists
        run: mkdir -p artifacts/showcases

      - name: Render showcase
        run: |
          npx tsx remotion/scripts/render-showcase.ts \
            "${{ github.event.inputs.recipe }}" \
            "${{ github.event.inputs.capture_path }}" \
            "${{ github.event.inputs.output_path }}"

      - name: Upload showcase artifact
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ github.event.inputs.recipe }}-${{ github.run_number }}
          path: ${{ github.event.inputs.output_path }}
          if-no-files-found: warn
