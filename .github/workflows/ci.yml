name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    env:
      # chef-runner layout: workspace under /opt/chef, HOME under /var/lib/chef.
      # Extends the shell_command tool cwd allowlist (see packages/extension/tools/shell_command.ts).
      SHELL_COMMAND_ALLOWED_CWD_PREFIXES: /opt/chef:/var/lib/chef

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci && (cd apps/remotion && npm install)

    - name: Run TypeScript type check
      run: npx -p typescript tsc --noEmit

    - name: Run Unit Tests
      run: npm run test

    - name: Run Validation (E2E)
      run: npm run test:e2e
