name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # Do not cache pip to avoid error "No file in ... matched to [**/requirements.txt or **/pyproject.toml]"
        # cache: 'pip'

    - name: Install dependencies
      run: npm install

    - name: Run Ruff (Python Linter & Formatter)
      run: pip install ruff && npm run lint:python

    - name: Run TypeScript Linter
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test

    - name: Run Validation (E2E)
      run: npm run test:e2e
